<!DOCTYPE html>
<html>

<head>
    <title>Finder NW</title>
    <link rel="stylesheet" href="node_modules/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="node_modules/@fortawesome/fontawesome-free/css/all.min.css" />
    <link rel="stylesheet" href="nw_finder.css" />
</head>

<body>
    <div id="panel">
        <a href="index.html" style="color: white; text-decoration: none; display: block; margin-bottom: 10px; font-weight: bold;">⬅ Voltar ao Menu</a>
        <div style="display: none;">
            <input type="checkbox" id="checkbox-modo">
            <label for="checkbox-modo">Modo Teste</label>
        </div>
        <div>
            <input type="checkbox" id="always-on-top" onchange="window.electronAPI && window.electronAPI.toggleAlwaysOnTop(this.checked)">
            <label for="always-on-top">Fixar no Topo</label>
        </div>
        <h2 style="display: none;">Finder NW</h2>
        <div id="commands">
            <div class="distance">
                <img class="dist-btn g" src="imgs_finder/RadarGreen.png", onclick="distClick(event, 0)" width="40", height="40">
                <img class="dist-btn y" src="imgs_finder/RadarYellow.png", onclick="distClick(event, 1)" width="40", height="40">
                <img class="dist-btn r" src="imgs_finder/RadarRed.png", onclick="distClick(event, 2)" width="40", height="40">
            </div>
            <div class="directions">
                <img class="dir-btn nw" onclick="dirClick(5)" src="imgs_finder/NorthWest.png", width="40", height="40">
                <img class="dir-btn n" onclick="dirClick(6)" src="imgs_finder/North.png", width="40", height="40">
                <img class="dir-btn ne" onclick="dirClick(7)" src="imgs_finder/NorthEast.png", width="40", height="40">
            </div>
            <div class="directions">
                <img class="dir-btn w" onclick="dirClick(4)" src="imgs_finder/West.png", width="40", height="40">
                <img class="dir-btn c" onclick="dirClick(-1)" src="imgs_finder/Center.png", width="40", height="40">
                <img class="dir-btn e" onclick="dirClick(0)" src="imgs_finder/East.png", width="40", height="40">
            </div>
            <div class="directions">
                <img class="dir-btn sw" onclick="dirClick(3)" src="imgs_finder/SouthWest.png", width="40", height="40">
                <img class="dir-btn s" onclick="dirClick(2)" src="imgs_finder/South.png", width="40", height="40">
                <img class="dir-btn se" onclick="dirClick(1)" src="imgs_finder/SouthEast.png", width="40", height="40">
            </div>            
        </div>  
        <div class="clear-panel" style="display: none;">
            <button id="clear-btn" onclick="clearList();">Limpar <img src="imgs_finder/Clear.png" width="32" height="32"></button>
        </div>
        <div id="pos-list" style="display: none;">            
        </div>
    </div>
    <div id="coords-display" class="minimap-coords">(X, Y, Z)</div>
    <div class="minimap-bottom-bar">
        <button id="btn-floor-up" class="minimap-btn" title="Subir Andar"><i class="fa-solid fa-arrow-up"></i></button>
        <button id="btn-floor-down" class="minimap-btn" title="Descer Andar"><i class="fa-solid fa-arrow-down"></i></button>
        <button id="btn-center" class="minimap-btn" title="Centralizar"><i class="fa-solid fa-crosshairs"></i></button>
        <button id="btn-zoom-in" class="minimap-btn" title="Zoom In"><i class="fa-solid fa-plus"></i></button>
        <button id="btn-zoom-out" class="minimap-btn" title="Zoom Out"><i class="fa-solid fa-minus"></i></button>
    </div>
    <div id="map"></div>

    <div id="context-menu" class="context-menu" style="display: none;">
        <button id="btn-copy-coord"><i class="fa-solid fa-copy"></i> Copiar: <span id="context-coord"></span></button>
    </div>
    <div class="finder-tools">
        <div class="finder-colors">
            <button class="color-btn green active" onclick="distClick(event, 0)" title="Curta Distância"></button>
            <button class="color-btn yellow" onclick="distClick(event, 1)" title="Média Distância"></button>
            <button class="color-btn red" onclick="distClick(event, 2)" title="Longa Distância"></button>
        </div>
        <div class="finder-compass">
            <button class="dir-btn" onclick="dirClick(7)" style="transform: rotate(-45deg)"><i class="fa-solid fa-arrow-up"></i></button>
            <button class="dir-btn" onclick="dirClick(6)"><i class="fa-solid fa-arrow-up"></i></button>
            <button class="dir-btn" onclick="dirClick(5)" style="transform: rotate(45deg)"><i class="fa-solid fa-arrow-up"></i></button>
            <button class="dir-btn" onclick="dirClick(4)" style="transform: rotate(-90deg)"><i class="fa-solid fa-arrow-up"></i></button>
            <button class="dir-btn center-dir" onclick="dirClick(-1)"><i class="fa-solid fa-dot-circle"></i></button>
            <button class="dir-btn" onclick="dirClick(0)" style="transform: rotate(90deg)"><i class="fa-solid fa-arrow-up"></i></button>
            <button class="dir-btn" onclick="dirClick(3)" style="transform: rotate(-135deg)"><i class="fa-solid fa-arrow-up"></i></button>
            <button class="dir-btn" onclick="dirClick(2)" style="transform: rotate(180deg)"><i class="fa-solid fa-arrow-up"></i></button>
            <button class="dir-btn" onclick="dirClick(1)" style="transform: rotate(135deg)"><i class="fa-solid fa-arrow-up"></i></button>
        </div>
    </div>
</body>

<script src="node_modules/leaflet/dist/leaflet.js"></script>
<script src="turf.bundle.js"></script>
<script src="nw_finder.js"></script>

</html>
